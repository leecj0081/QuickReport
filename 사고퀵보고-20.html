<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>현장 사고 퀵보고</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx-js-style/1.2.0/xlsx.bundle.js"></script>
<!-- Firebase SDK (채널 동기화용 — 회사 방화벽에서 막히면 아래 STORAGE_MODE를 'local'로 변경) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8441a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="퀵보고">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
<style>
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface2:#f0f3f7;
  --border:#dde3ea;
  --text:#1c2733;
  --muted:#6b7a8d;
  --accent:#e8441a;
  --accent2:#ff6b3d;
  --ok:#0d9e6e;
  --warn:#d97706;
  --danger:#dc2626;
  --navy:#1e3a5f;
  --navy2:#2a4f82;
  --r:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:90px;}

/* ── 채널 진입 화면 ── */
#channelScreen{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#0f1e30 0%,#1e3a5f 60%,#2a1f3d 100%);
}
.ch-box{width:100%;max-width:360px;padding:0 24px;text-align:center;}
.ch-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 8px 32px rgba(232,68,26,.4);}
.ch-logo svg{width:28px;height:28px;}
.ch-box h1{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px;margin-bottom:6px;}
.ch-box p{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:32px;line-height:1.6;}
.ch-label{display:block;text-align:left;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.ch-input{
  width:100%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.15);
  color:#fff;border-radius:12px;padding:15px 16px;font-size:18px;font-weight:800;
  letter-spacing:3px;text-align:center;outline:none;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
.ch-input::placeholder{color:rgba(255,255,255,.2);letter-spacing:1px;font-size:14px;font-weight:400;}
.ch-input:focus{border-color:var(--accent2);box-shadow:0 0 0 4px rgba(255,107,61,.2);}
.ch-hint{font-size:11.5px;color:rgba(255,255,255,.3);margin-top:10px;margin-bottom:24px;}
.ch-btn{
  width:100%;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:800;
  color:#fff;cursor:pointer;font-family:inherit;letter-spacing:.2px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 6px 20px rgba(232,68,26,.4);transition:.12s;
}
.ch-btn:active{transform:scale(.98);}
.ch-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(255,255,255,.2);font-size:12px;}
.ch-divider::before,.ch-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1);}
.ch-new{
  width:100%;border:1.5px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;
  font-size:14px;font-weight:700;color:rgba(255,255,255,.6);cursor:pointer;
  font-family:inherit;background:transparent;transition:.12s;
}
.ch-new:active{background:rgba(255,255,255,.05);}

/* ── 앱 메인 ── */
#app{display:none;}
header{
  position:sticky;top:0;z-index:30;background:rgba(245,247,250,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
}
.head-inner{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.head-siren{
  width:36px;height:36px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 0 0 3px rgba(232,68,26,.12);
  animation:hpulse 2.5s infinite;
}
@keyframes hpulse{0%,100%{box-shadow:0 0 0 3px rgba(232,68,26,.12);}50%{box-shadow:0 0 0 8px rgba(232,68,26,.03);}}
.head-siren svg{width:18px;height:18px;}
.head-txt{flex:1;}
.head-txt h1{font-size:15px;font-weight:900;letter-spacing:-.3px;}
.head-txt p{font-size:11px;color:var(--muted);margin-top:1px;}
.ch-badge{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;
  transition:.12s;white-space:nowrap;
}
.ch-badge:active{background:var(--border);}
.ch-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}

/* ── 탭 ── */
.tabs{max-width:680px;margin:0 auto;display:flex;padding:0 16px;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:12px 0;text-align:center;font-size:13.5px;font-weight:700;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;position:relative;transition:.15s;}
.tab.on{color:var(--accent);}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;}
.tab .badge{display:inline-block;min-width:17px;padding:0 4px;height:17px;line-height:17px;border-radius:9px;background:var(--surface2);color:var(--muted);font-size:10.5px;margin-left:4px;vertical-align:1px;}
.tab.on .badge{background:var(--accent);color:#fff;}
.page{display:none;}.page.on{display:block;}

/* ── 알림 팝업 ── */
/* ── 일반 알림 카드 (우상단) ── */
#notifStack{position:fixed;top:70px;right:12px;z-index:50;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:300px;}
.notif{
  background:var(--navy);color:#fff;border-radius:13px;padding:13px 14px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);pointer-events:all;
  animation:nslide .3s ease;transform-origin:right top;
  border-left:4px solid var(--accent);
}
@keyframes nslide{from{opacity:0;transform:translateX(20px) scale(.95);}to{opacity:1;transform:translateX(0) scale(1);}}
.notif-head{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.notif-head b{font-size:12.5px;flex:1;}
.notif-head .ntime{font-size:10px;color:rgba(255,255,255,.4);}
.notif-body{font-size:12px;color:rgba(255,255,255,.75);line-height:1.45;margin-bottom:10px;}
.notif-ok{
  width:100%;border:none;border-radius:8px;padding:8px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;background:rgba(255,255,255,.15);color:#fff;
  transition:.12s;
}
.notif-ok:hover{background:rgba(255,255,255,.25);}

/* ── 긴급 모달 (전체 화면) ── */
.urg-scrim{
  position:fixed;inset:0;z-index:80;
  background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  animation:uscrim .25s ease;
  padding:20px;
}
@keyframes uscrim{from{opacity:0;}to{opacity:1;}}
.urg-modal{
  background:#fff;border-radius:18px;width:100%;max-width:340px;
  overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);
  animation:umodal .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes umodal{from{opacity:0;transform:scale(.88) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.urg-top{
  background:linear-gradient(135deg,#b91c1c,#dc2626);
  padding:22px 20px 18px;text-align:center;
}
.urg-icon{font-size:38px;margin-bottom:6px;animation:urgpulse 1s ease infinite;}
@keyframes urgpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.urg-top h3{color:#fff;font-size:18px;font-weight:900;margin:0 0 3px;letter-spacing:-.3px;}
.urg-top p{color:rgba(255,255,255,.8);font-size:12.5px;margin:0;}
.urg-body{padding:16px 18px;}
.urg-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;font-size:13px;}
.urg-lbl{font-size:11.5px;font-weight:700;color:#6b7280;min-width:48px;padding-top:1px;}
.urg-val{color:#1c2733;font-weight:600;line-height:1.4;}
.urg-content{background:#f8f9fa;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#374151;line-height:1.5;margin-bottom:14px;}
.urg-btn{
  width:100%;border:none;border-radius:11px;padding:15px;font-size:15px;font-weight:900;
  cursor:pointer;font-family:inherit;color:#fff;letter-spacing:.2px;
  background:linear-gradient(135deg,#dc2626,#ef4444);
  box-shadow:0 4px 14px rgba(220,38,38,.4);transition:.12s;
}
.urg-btn:active{transform:scale(.98);}

/* ── wrap ── */
.wrap{max-width:680px;margin:0 auto;padding:0 14px;}

/* ── 공지 배너 ── */
.notice{margin:14px 0 2px;padding:10px 13px;border-radius:10px;background:#fff8f6;border:1px solid rgba(232,68,26,.22);font-size:12px;color:#8a3020;display:flex;gap:7px;align-items:flex-start;line-height:1.5;}
.notice b{color:#5c1e10;}

/* ── 폼 필드 ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
@media(max-width:500px){.grid{grid-template-columns:1fr;}}
.field{margin-top:14px;}
label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:6px;color:#2a3a4a;}
.num{width:18px;height:18px;border-radius:5px;flex:0 0 auto;background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;}
.req{color:var(--accent);font-size:11px;font-weight:800;margin-left:1px;}
.opt{color:var(--muted);font-size:11px;font-weight:600;margin-left:auto;}
input[type=text],input[type=datetime-local],select,textarea{
  width:100%;background:#fff;border:1.5px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px 13px;font-size:14.5px;font-family:inherit;outline:none;
  transition:border-color .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(0,0,0,.04);
}
input::placeholder,textarea::placeholder{color:#aab4be;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,68,26,.1);}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7a8d' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:40px;background-color:#fff;}
textarea{resize:vertical;min-height:88px;line-height:1.5;}
.hint{font-size:11px;color:var(--muted);margin-top:5px;}

/* ── 칩 ── */
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:#3d4e5e;font-size:13.5px;font-weight:600;cursor:pointer;transition:.13s;user-select:none;}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(232,68,26,.28);}

/* ── 부상정도 ── */
.sev{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.sev button{border:1.5px solid var(--border);background:#fff;color:#3d4e5e;border-radius:10px;padding:11px 4px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.13s;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;}
.sev button .dot{width:8px;height:8px;border-radius:50%;background:#b0bcc8;}
.sev button:active{transform:scale(.96);}
.sev button[data-v=none].on{border-color:var(--ok);color:var(--ok);background:rgba(13,158,110,.08);}
.sev button[data-v=light].on{border-color:var(--warn);color:var(--warn);background:rgba(217,119,6,.09);}
.sev button[data-v=severe].on{border-color:var(--accent);color:var(--accent);background:rgba(232,68,26,.09);}
.sev button[data-v=death].on{border-color:var(--danger);color:var(--danger);background:rgba(220,38,38,.1);}
.sev button[data-v=none].on .dot{background:var(--ok);}
.sev button[data-v=light].on .dot{background:var(--warn);}
.sev button[data-v=severe].on .dot{background:var(--accent);}
.sev button[data-v=death].on .dot{background:var(--danger);}

/* ── 사진 ── */
.photo-drop{border:1.5px dashed var(--border);border-radius:11px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;background:#fafbfc;}
.photo-drop b{color:#3d4e5e;font-size:13px;display:block;margin-top:4px;}
.photo-drop span{font-size:11.5px;}
.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.thumb{position:relative;width:68px;height:68px;border-radius:9px;overflow:hidden;border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb b{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;display:grid;place-items:center;cursor:pointer;}

/* ── 이력 ── */
.hist-bar{display:flex;align-items:center;gap:9px;margin:14px 0 10px;}
.hist-bar .count{font-size:12.5px;color:var(--muted);font-weight:600;}
.hist-bar .count b{color:var(--text);font-size:14.5px;}
.btn-excel{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s;box-shadow:0 3px 10px rgba(30,58,95,.22);}
.btn-excel:active{transform:translateY(1px);}
.btn-excel:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn-excel svg{width:14px;height:14px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;}
.card .ctop{display:flex;align-items:flex-start;gap:9px;margin-bottom:7px;}
.card .ctitle{font-size:14px;font-weight:800;line-height:1.35;flex:1;}
.sev-tag{flex:0 0 auto;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px;white-space:nowrap;}
.sev-tag.none{background:rgba(13,158,110,.1);color:var(--ok);}
.sev-tag.light{background:rgba(217,119,6,.11);color:var(--warn);}
.sev-tag.severe{background:rgba(232,68,26,.11);color:var(--accent);}
.sev-tag.death{background:rgba(220,38,38,.12);color:var(--danger);}
.card .cmeta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);}
.card .cmeta b{color:#3d4e5e;font-weight:600;}
.card .ccontent{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:#4a5a6a;line-height:1.5;}
.card .cdel{position:absolute;top:10px;right:10px;width:22px;height:22px;border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty svg{width:42px;height:42px;opacity:.3;margin-bottom:10px;}
/* 사후처리 */
.after-row{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);}
.after-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:7px;white-space:nowrap;}
.after-edit-btn{margin-left:auto;border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;}
/* 사후처리 모달 */
.after-modal-scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center;}
.after-modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;padding:20px 20px calc(20px + env(safe-area-inset-bottom));}
.after-modal h3{font-size:16px;font-weight:900;margin-bottom:4px;}
.after-modal p{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.pw-field{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;margin-bottom:12px;}
.pw-field:focus{border-color:var(--accent);}
.after-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.after-opt{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center;transition:.13s;}
.after-opt:active{transform:scale(.97);}
.after-opt.sel{border-color:var(--navy);background:var(--navy);color:#fff;}
.after-opt[data-v=industry].sel{border-color:#2563eb;background:#2563eb;}
.after-opt[data-v=work].sel{border-color:#16a34a;background:#16a34a;}
.after-opt[data-v=etc].sel{border-color:#7c3aed;background:#7c3aed;}
.after-save-btn{width:100%;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(232,68,26,.3);}
/* 대시보드 */
.dash-section{margin-top:16px;}
.dash-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px;margin-bottom:10px;text-transform:uppercase;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.kpi-card .kv{font-size:28px;font-weight:900;line-height:1;margin-bottom:4px;}
.kpi-card .kl{font-size:12px;color:var(--muted);font-weight:600;}
.kpi-card.accent{border-color:var(--accent);background:linear-gradient(135deg,#fff5f3,#fff);}
.kpi-card.accent .kv{color:var(--accent);}
.kpi-card.ok .kv{color:var(--ok);}
.kpi-card.warn .kv{color:var(--warn);}
.kpi-card.danger .kv{color:var(--danger);}
.donut-wrap{background:#fff;border:1px solid var(--border);border-radius:13px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.donut-wrap canvas{display:block;margin:0 auto;}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;justify-content:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;}
.after-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.after-sum-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.after-sum-card .asv{font-size:22px;font-weight:900;margin-bottom:3px;}
.after-sum-card .asl{font-size:11.5px;color:var(--muted);font-weight:600;}
.site-bar{background:#fff;border:1px solid var(--border);border-radius:13px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.site-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.site-row:last-child{margin-bottom:0;}
.site-name{font-size:12.5px;font-weight:600;min-width:90px;color:var(--text);}
.site-bar-bg{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.site-bar-fill{height:100%;border-radius:4px;background:var(--navy);transition:.4s;}
.site-count{font-size:12px;font-weight:700;color:var(--muted);min-width:24px;text-align:right;}
/* 미확인 카드 강조 */
.card.unread{border-color:var(--accent);border-width:1.5px;background:#fffbfa;}
.card.unread .ctitle::before{content:'●';color:var(--accent);font-size:8px;vertical-align:3px;margin-right:5px;}
.unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:0 5px;margin-left:4px;vertical-align:1px;}
/* 미확인 알림 배너 */
.unread-banner{background:#fff5f3;border:1.5px solid rgba(232,68,26,.3);border-radius:12px;padding:14px 15px;margin:14px 0 4px;display:flex;align-items:center;gap:10px;}
.unread-banner .ub-icon{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto;}
.unread-banner .ub-icon svg{width:18px;height:18px;}
.unread-banner .ub-txt b{font-size:13.5px;color:#8a2415;display:block;margin-bottom:2px;}
.unread-banner .ub-txt span{font-size:12px;color:#b3361f;}
.unread-banner .ub-btn{margin-left:auto;border:none;background:var(--accent);color:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto;}

/* ── 등록 바 ── */
.submitbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(0deg,rgba(245,247,250,1) 60%,rgba(245,247,250,0));padding:12px 16px calc(12px + env(safe-area-inset-bottom));}
.submitbar .inner{max-width:680px;margin:0 auto;}
.btn-submit{width:100%;border:none;border-radius:12px;padding:16px;font-size:15.5px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 20px rgba(232,68,26,.32);transition:.12s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.1px;}
.btn-submit:active{transform:translateY(1px);filter:brightness(1.05);}

/* ── 토스트 ── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;opacity:0;pointer-events:none;transition:.2s;}
.scrim.show{opacity:1;}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;z-index:60;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 20px 60px rgba(0,0,0,.15);max-width:320px;width:calc(100% - 32px);}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.toast .ic{width:50px;height:50px;border-radius:50%;background:rgba(13,158,110,.12);display:grid;place-items:center;margin:0 auto 12px;}
.toast h3{font-size:16px;font-weight:900;margin-bottom:5px;}
.toast p{font-size:12.5px;color:var(--muted);}
.dispatch{text-align:left;margin-top:12px;padding:11px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);}
.dispatch h4{font-size:11.5px;color:var(--navy);font-weight:800;margin-bottom:5px;}
.dispatch .dmsg{font-size:11.5px;color:#3a4a5a;line-height:1.5;white-space:pre-wrap;}
.dispatch .dto{font-size:10.5px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<!-- ═══ 채널 진입 화면 ═══ -->
<div id="channelScreen">
  <div class="ch-box">
    <div class="ch-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    </div>
    <h1>사고 퀵보고</h1>
    <p>채널 코드를 입력하면<br>같은 코드를 가진 팀과 보고를 공유합니다.</p>
    <span class="ch-label">채널 코드</span>
    <input class="ch-input" id="chInput" placeholder="예) SAFETY-2026" maxlength="20">
    <div class="ch-hint">관리자에게 채널 코드를 받아 입력하세요.</div>
    <button class="ch-btn" id="chEnter">입장하기</button>
    <div class="ch-divider">또는</div>
    <button class="ch-new" id="chNew">새 채널 코드 만들기</button>
  </div>
</div>

<!-- ═══ 앱 메인 ═══ -->
<div id="app">
  <header>
    <div class="head-inner">
      <div class="head-siren">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      </div>
      <div class="head-txt">
        <h1>현장 사고 퀵보고</h1>
        <p>신속 보고 · 정식 내용은 보고서에 작성</p>
      </div>
      <div class="ch-badge" id="chBadge">
        <span class="dot"></span>
        <span id="chLabel">-</span>
      </div>
      <button id="notifBtn" onclick="requestPushPermission()" style="
        display:none;border:none;border-radius:8px;padding:6px 11px;
        background:#e8441a;color:#fff;font-size:12px;font-weight:700;
        cursor:pointer;font-family:inherit;margin-left:6px;white-space:nowrap;
      ">🔔 알림 켜기</button>
    </div>
  </header>
  <nav class="tabs" style="background:rgba(245,247,250,.94);backdrop-filter:blur(12px);">
    <button class="tab on" data-page="dash">대시보드</button>
    <button class="tab" data-page="write">보고 작성</button>
    <button class="tab" data-page="hist">이력 <span class="badge" id="histBadge">0</span></button>
  </nav>

  <div class="wrap">
    <!-- ── 대시보드 페이지 ── -->
    <div class="page on" id="page-dash">
      <div id="dashContent"></div>
    </div>

    <!-- ── 작성 페이지 ── -->
    <div class="page" id="page-write">
      <div class="notice"><span>⚡</span><div><b>신속성이 최우선.</b> 핵심만 입력 후 등록하세요. 상세 내용은 이후 정식 보고서에.</div></div>
      <form id="form" onsubmit="return false;">

        <div class="field">
          <label><span class="num">1</span> 제목 <span class="req">*</span>
            <span class="opt" id="autoTitleBtn" style="cursor:pointer;color:var(--accent)">자동생성</span>
          </label>
          <input type="text" id="title" placeholder="예) 3층 슬래브 단부 추락 사고">
        </div>

        <div class="grid">
          <div class="field">
            <label><span class="num">2</span> 사업장명 <span class="req">*</span></label>
            <select id="site">
              <option value="">현장 선택</option>
              <option>서이천 현장</option>
              <option>장계리 현장</option>
              <option>청주 현장</option>
              <option>칠서 현장</option>
              <option>신허브센터 현장</option>
              <option>이든파마 현장</option>
              <option value="__etc">실내건축 현장 (직접 입력)</option>
            </select>
            <input type="text" id="siteEtc" placeholder="실내건축 현장명 입력" style="display:none;margin-top:8px;">
          </div>
          <div class="field">
            <label><span class="num">3</span> 사고일시 <span class="req">*</span></label>
            <input type="datetime-local" id="datetime">
            <div class="hint">기본값: 현재 시각 (수정 가능)</div>
          </div>
        </div>

        <div class="field">
          <label><span class="num">4</span> 사고유형 <span class="req">*</span></label>
          <div class="chips" id="typeChips">
            <span class="chip">떨어짐</span><span class="chip">끼임</span><span class="chip">붕괴</span>
            <span class="chip">넘어짐</span><span class="chip">찔림</span><span class="chip">맞음</span>
            <span class="chip">절단</span><span class="chip">감전</span><span class="chip" data-etc="1">기타</span>
          </div>
          <input type="text" id="typeEtc" placeholder="기타 유형 입력" style="display:none;margin-top:9px;">
        </div>

        <div class="field">
          <label><span class="num">5</span> 사고원인 <span class="opt">선택·추정 가능</span></label>
          <select id="cause">
            <option value="">원인 선택 (추정)</option>
            <option>안전난간·덮개 등 방호조치 미흡</option>
            <option>개인보호구 미착용·불량</option>
            <option>작업절차·작업계획 미준수</option>
            <option>설비·기계 결함 및 정비 불량</option>
            <option>정리정돈 불량 (전도·낙하물)</option>
            <option>안전교육·작업지시 미흡</option>
            <option>중량물·자재 취급 부주의</option>
            <option>기상·지반 등 외부요인</option>
            <option>원인 미상 (조사 필요)</option>
          </select>
        </div>

        <div class="grid">
          <div class="field">
            <label><span class="num">6</span> 사고장소 <span class="req">*</span></label>
            <input type="text" id="place" placeholder="예) 지하 1층 PIT실 입구">
          </div>
          <div class="field">
            <label><span class="num">7</span> 부상(피해) 정도 <span class="req">*</span></label>
            <div class="sev" id="sev">
              <button type="button" data-v="none"><span class="dot"></span>무상해</button>
              <button type="button" data-v="light"><span class="dot"></span>경상</button>
              <button type="button" data-v="severe"><span class="dot"></span>중상</button>
              <button type="button" data-v="death"><span class="dot"></span>사망</button>
            </div>
          </div>
        </div>

        <div class="field">
          <label><span class="num">8</span> 사고내용 <span class="opt">간략히</span></label>
          <textarea id="content" placeholder="간략한 상황 설명 및 의사 초기 진단. (상세는 정식 보고서에)"></textarea>
        </div>

        <div class="field" style="margin-bottom:4px;">
          <label><span class="num">9</span> 현장 사진 <span class="opt">선택</span></label>
          <div class="photo-drop" id="photoDrop">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            <b>사진 촬영 / 선택</b>
            <span>현장 상황을 사진으로 남기면 명확해집니다</span>
          </div>
          <input type="file" id="photoInput" accept="image/*" multiple capture="environment" style="display:none;">
          <div class="thumbs" id="thumbs"></div>
        </div>

      </form>
    </div>

    <!-- ── 이력 페이지 ── -->
    <div class="page" id="page-hist">
      <div class="hist-bar" id="histBar">
        <span class="count">총 <b id="totalCount">0</b>건 누적</span>
        <button class="btn-excel" id="excelBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          엑셀 다운로드
        </button>
      </div>
      <div id="histList"></div>
    </div>
  </div>
</div>

<!-- ── 등록 버튼 ── -->
<div class="submitbar" id="submitbar" style="display:none;">
  <div class="inner">
    <button class="btn-submit" id="submitBtn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      사고 보고 등록
    </button>
  </div>
</div>

<!-- ── 알림 스택 ── -->
<div id="notifStack"></div>

<!-- ── 토스트 ── -->
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast">
  <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0d9e6e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h3>보고가 등록되었습니다</h3>
  <p>채널 전원에게 알림이 전송됩니다.</p>
  <div class="dispatch">
    <h4>📨 알림 발송 내용 (미리보기)</h4>
    <div class="dmsg" id="dispatchMsg"></div>
    <div class="dto" id="dispatchTo"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
// 저장소 어댑터 — Firebase 키를 채우면 실서비스 전환
// Firebase가 막혀 있으면 STORAGE_MODE = 'local' 로 변경
// ═══════════════════════════════════════════
const STORAGE_MODE = 'firebase'; // 'firebase' | 'local'

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyC9ORKNAg0YFlE9sIRt_CDvnWRoiEQrqI0",
  authDomain:        "aben0119.firebaseapp.com",
  databaseURL:       "https://aben0119-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "aben0119",
  messagingSenderId: "811060567071",
  appId:             "1:811060567071:web:853d0477f516debc00892a"
};
const VAPID_KEY = "BHmReQ9JmjMJ4MppbB1UyD4GkK9eK4BsO78zSlczmmTexNBkuWIb7qWfXtLMIQupG30SnqpLp6qIyvbLWzuTunA";

// ───────────────────────────────────────────
// 채널 상태
let CHANNEL = '';
let reports = [];
const SEV_LABEL = {none:'무상해', light:'경상', severe:'중상', death:'사망'};
let selType = '', selSev = '', files = [];
let readSet = new Set(); // 내 기기에서 확인한 보고 ID 집합

// ───────────────────────────────────────────
// 저장 어댑터
const DB = {
  async load() {
    if (STORAGE_MODE === 'firebase') {
      return new Promise(res => {
        firebase.database().ref('channels/' + CHANNEL + '/reports')
          .once('value', snap => {
            const val = snap.val();
            res(val ? Object.values(val).sort((a,b) => b.id - a.id) : []);
          });
      });
    } else {
      try {
        const r = await window.storage.get('ch_' + CHANNEL);
        return r && r.value ? JSON.parse(r.value) : [];
      } catch { return []; }
    }
  },
  async save(reps) {
    if (STORAGE_MODE === 'firebase') {
      const obj = {};
      reps.forEach(r => { obj[r.id] = r; });
      await firebase.database().ref('channels/' + CHANNEL + '/reports').set(obj);
    } else {
      try { await window.storage.set('ch_' + CHANNEL, JSON.stringify(reps)); } catch {}
    }
  },
  onNew(cb) {
    if (STORAGE_MODE === 'firebase') {
      // 입장 시각 기록 — 이 시각 이후 등록된 보고만 알림
      const joinedAt = Date.now();
      window._notifLog = [];  // 진단용 로그
      firebase.database().ref('channels/' + CHANNEL + '/reports')
        .on('child_added', snap => {
          const rep = snap.val();
          const isNew = rep.id > joinedAt;
          window._notifLog.push({
            title: rep.title, id: rep.id,
            joinedAt, diff: rep.id - joinedAt, fired: isNew
          });
          if (isNew) cb(rep);
        });
    } else {
      try {
        const bc = new BroadcastChannel('saf_' + CHANNEL);
        bc.onmessage = e => cb(e.data);
        window._bc = bc;
      } catch {}
    }
  },
  async broadcast(rep) {
    if (STORAGE_MODE !== 'firebase') {
      try { window._bc && window._bc.postMessage(rep); } catch {}
    }
    // Firebase는 onNew 리스너가 자동으로 다른 클라이언트에게 전달
  }
};

// ───────────────────────────────────────────
// 확인 기록 (기기 로컬 저장)
function readKey() { return 'read_' + CHANNEL; }
// readMap: { id → 확인시각(ISO) } 형태로 저장
let readMap = {}; // id → 확인시각

async function loadReadSet() {
  try {
    const r = await window.storage.get(readKey());
    readMap = r && r.value ? JSON.parse(r.value) : {};
    // readSet은 readMap의 키 집합으로 동기화
    readSet = new Set(Object.keys(readMap));
  } catch { readMap = {}; readSet = new Set(); }
}
async function markRead(id) {
  const sid = String(id);
  if (!readMap[sid]) {
    readMap[sid] = new Date().toISOString(); // 확인 시각 기록
    readSet.add(sid);
    try { await window.storage.set(readKey(), JSON.stringify(readMap)); } catch {}
  }
}
async function markAllRead() {
  const now = new Date().toISOString();
  reports.forEach(r => {
    const sid = String(r.id);
    if (!readMap[sid]) readMap[sid] = now;
    readSet.add(sid);
  });
  try { await window.storage.set(readKey(), JSON.stringify(readMap)); } catch {}
  renderHist();
}
function unreadCount() {
  return reports.filter(r => !readSet.has(String(r.id))).length;
}

// ───────────────────────────────────────────
// 채널 진입 화면
document.getElementById('chEnter').onclick = () => enterChannel(
  document.getElementById('chInput').value.trim().toUpperCase()
);
document.getElementById('chInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('chEnter').click();
});
document.getElementById('chNew').onclick = () => {
  const code = 'CH-' + Math.random().toString(36).slice(2,6).toUpperCase();
  document.getElementById('chInput').value = code;
  document.getElementById('chInput').focus();
};

async function enterChannel(code) {
  if (!code) { alert('채널 코드를 입력하세요.'); return; }
  CHANNEL = code;
  document.getElementById('chLabel').textContent = code;
  document.getElementById('channelScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if (STORAGE_MODE === 'firebase') {
    // Firebase 초기화 — 이미 초기화된 경우 기존 앱 재사용
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(FIREBASE_CONFIG);
      }
    } catch(e) { console.warn('Firebase 초기화:', e); }

    // 연결 상태 표시
    setConnStatus('connecting');
    firebase.database().ref('.info/connected').on('value', snap => {
      setConnStatus(snap.val() ? 'connected' : 'disconnected');
    });

    // FCM: 자동 호출 제거 — 사용자가 버튼 클릭 시 요청
  }

  // 알림 켜기 버튼 표시
  if (STORAGE_MODE === 'firebase') {
    setTimeout(() => {
      const btn = document.getElementById('notifBtn');
      if (btn && Notification.permission !== 'granted') btn.style.display = 'inline-block';
    }, 1000);
  }

  // onNew 리스너를 먼저 등록한 뒤 load
  DB.onNew(rep => {
    showNotif(rep);
    renderHist(); // 새 보고 수신 시 이력도 즉시 갱신
  });
  await loadReadSet();
  reports = await DB.load();
  renderHist();
  renderDash(); // 대시보드가 첫 화면이므로 즉시 렌더
  setDatetime();

  // 입장 시 미확인 보고가 있으면 알림
  const unread = unreadCount();
  if (unread > 0) {
    showUnreadBanner(unread);
  }
}

// FCM 푸시 토큰 등록 및 포그라운드 푸시 수신
// 사용자 클릭으로 알림 권한 요청 (모바일 크롬 정책 대응)
async function requestPushPermission() {
  const btn = document.getElementById('notifBtn');
  if (btn) btn.textContent = '요청 중...';
  await initFCM();
  if (Notification.permission === 'granted') {
    if (btn) btn.style.display = 'none';
  } else {
    if (btn) btn.textContent = '🔔 알림 켜기';
  }
}

async function initFCM() {
  showFCMStatus('⏳ 알림 설정 시작...', '#f59e0b');

  // 브라우저 지원 확인
  if (!('serviceWorker' in navigator) || !('Notification' in window)) {
    showFCMStatus('❌ 이 브라우저는 푸시 알림을 지원하지 않습니다. 크롬으로 접속해주세요.', '#dc2626');
    return;
  }

  try {
    // ── 1단계: 알림 권한 요청
    showFCMStatus('⏳ 1단계: 알림 권한 요청 중...', '#f59e0b');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      showFCMStatus('❌ 알림 권한이 거부됐습니다. 크롬 설정에서 알림을 허용해주세요.', '#dc2626');
      showPermDeniedHint();
      return;
    }
    showFCMStatus('✅ 1단계 완료: 알림 권한 허용됨', '#16a34a');

    // ── 2단계: Service Worker 등록
    showFCMStatus('⏳ 2단계: 서비스 워커 등록 중...', '#f59e0b');
    const swPath = '/QuickReport/sw.js';
    let reg;
    try {
      reg = await navigator.serviceWorker.register(swPath, { scope: '/QuickReport/' });
      await navigator.serviceWorker.ready;
      showFCMStatus('✅ 2단계 완료: 서비스 워커 등록됨', '#16a34a');
    } catch(swErr) {
      showFCMStatus('❌ 2단계 실패: ' + swErr.message, '#dc2626');
      return;
    }

    // ── 3단계: FCM 토큰 발급
    showFCMStatus('⏳ 3단계: 알림 토큰 발급 중...', '#f59e0b');
    let token;
    try {
      const messaging = firebase.messaging();
      token = await messaging.getToken({
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: reg
      });

      // ── 4단계: 포그라운드 수신 등록
      messaging.onMessage(payload => {
        const data = payload.data || {};
        showNotif({
          title: data.title || payload.notification?.title,
          site: data.site, type: data.type, sev: data.sev,
          place: data.place, dt: data.dt, content: data.content
        });
      });
    } catch(tokenErr) {
      showFCMStatus('❌ 3단계 실패: ' + tokenErr.message, '#dc2626');
      return;
    }

    if (token) {
      // ── 4단계: DB 토큰 저장
      showFCMStatus('⏳ 4단계: 토큰 저장 중...', '#f59e0b');
      try {
        await firebase.database().ref('channels/' + CHANNEL + '/tokens/' + token).set({
          token, updatedAt: Date.now()
        });
        showFCMStatus('', ''); // 상태바 숨김
        showPushEnabled();
      } catch(dbErr) {
        showFCMStatus('❌ 4단계 실패 (DB 저장): ' + dbErr.message, '#dc2626');
      }
    } else {
      showFCMStatus('❌ 토큰 발급 실패: 토큰이 비어있습니다. VAPID 키 또는 Firebase 설정을 확인하세요.', '#dc2626');
    }

  } catch(e) {
    showFCMStatus('❌ 오류: ' + e.message, '#dc2626');
  }
}

function buildDispatch(rep) {
  const urgent = rep.sev === 'severe' || rep.sev === 'death';
  const head = urgent ? '🚨[긴급] 현장 사고 발생' : '[알림] 현장 사고 보고';
  const msg =
`${head}
─────────────
▪ 현장: ${rep.site}
▪ 유형: ${rep.type}
▪ 피해: ${SEV_LABEL[rep.sev]}
▪ 장소: ${rep.place}
▪ 일시: ${rep.dt.replace('T',' ')}${rep.content ? '\n▪ 내용: '+rep.content : ''}
─────────────
* 퀵보고입니다. 정식 보고서 확인 요망.`;
  const to = urgent
    ? '수신: 안전보건팀 전원 + 담당 임원 + 대표이사'
    : '수신: 안전보건팀 전원 + 현장 관리자';
  return { msg, to };
}

const scrim = document.getElementById('scrim');
const toast = document.getElementById('toast');

document.getElementById('submitBtn').onclick = async () => {
  const titleVal = document.getElementById('title').value.trim();
  if (!titleVal) { alert('제목을 입력하세요.'); document.getElementById('title').focus(); return; }
  if (!getSiteName()) { alert('사업장명을 선택하세요.'); site.focus(); return; }
  const placeVal = document.getElementById('place').value.trim();
  if (!placeVal) { alert('사고장소를 입력하세요.'); document.getElementById('place').focus(); return; }
  if (!selType) { alert('사고유형을 선택하세요.'); return; }
  if (!selSev)  { alert('부상(피해) 정도를 선택하세요.'); return; }

  const typeVal = selType === '기타' ? (typeEtc.value.trim() || '기타') : selType;
  const rep = {
    id: Date.now(), title: titleVal, site: getSiteName(),
    dt: document.getElementById('datetime').value, type: typeVal,
    cause: document.getElementById('cause').value || '',
    place: placeVal, sev: selSev,
    content: document.getElementById('content').value.trim(),
    photos: files.length, channel: CHANNEL,
    reportedAt: new Date().toISOString()
  };

  reports.unshift(rep);
  await DB.save(reports);
  await DB.broadcast(rep);
  await markRead(rep.id);
  sendFCMToChannel(rep);
  renderHist();
  renderDash();

  const d = buildDispatch(rep);
  document.getElementById('dispatchMsg').textContent = d.msg;
  document.getElementById('dispatchTo').textContent = d.to;
  scrim.classList.add('show'); toast.classList.add('show');
  setTimeout(() => { scrim.classList.remove('show'); toast.classList.remove('show'); }, 3600);
  resetForm();
};

function resetForm() {
  document.getElementById('title').value = '';
  document.getElementById('place').value = '';

  site.value = ''; siteEtc.style.display = 'none'; siteEtc.value = '';

}

    list.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg><p>등록된 사고 보고가 없습니다.</p></div>`;

  // hist-bar 통째로 다시 그리기 — DOM 조작으로 excelBtn onclick 끊기는 문제 방지

  const AFTER_COLOR = {none:'#9aa6b1', industry:'#2563eb', work:'#16a34a', etc:'#7c3aed'};

  list.innerHTML = reports.map(r => {
    const sid = String(r.id);

    const afterLbl = AFTER_LABEL[afterVal];
    const afterClr = AFTER_COLOR[afterVal];
    return `
    <div class="card${isUnread ? ' unread' : ''}" data-id="${r.id}">
      <button class="cdel" data-id="${r.id}">×</button>
      <div class="ctop">
        <div class="ctitle">${esc(r.title)}</div>

        ${r.cause ? `<span>🔎 ${esc(r.cause)}</span>` : ''}
        ${r.photos ? `<span>📷 ${r.photos}장</span>` : ''}
        ${readAt ? `<span style="color:var(--ok);font-size:11px;">✅ 확인 ${readAt}</span>` : '<span style="color:var(--accent);font-size:11px;font-weight:700;">⚪ 미확인</span>'}
      </div>
      ${r.content ? `<div class="ccontent">${esc(r.content)}</div>` : ''}
      <div class="after-row">
        <span class="after-badge" style="background:${afterClr}20;color:${afterClr};border:1px solid ${afterClr}40;">
          ⚙ 사후처리: ${afterLbl}
        </span>
        <button class="after-edit-btn" data-id="${r.id}" onclick="openAfterEdit('${r.id}')">수정</button>
      </div>
    </div>`;
  }).join('');

  // 카드 클릭 시 확인 처리
  list.querySelectorAll('.card[data-id]').forEach(card => {
    card.addEventListener('click', async (e) => {
      if (e.target.classList.contains('cdel')) return;
      const id = card.dataset.id;
      if (!readSet.has(id)) {
        await markRead(id);
        card.classList.remove('unread');
        renderHist();
      }
    });
  });

  list.querySelectorAll('.cdel').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    if (!confirm('이 보고를 삭제할까요?')) return;
    reports = reports.filter(x => x.id != b.dataset.id);
    await DB.save(reports); renderHist();
  });
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ───────────────────────────────────────────
// 엑셀 다운로드 (디자인)
// 채널에 등록된 모든 토큰에 FCM 푸시 발송
async function sendFCMToChannel(rep) {
  try {
    const snap = await firebase.database().ref('channels/' + CHANNEL + '/tokens').once('value');
    const tokens = snap.val();
    if (!tokens) return;

    const urgent = rep.sev === 'severe' || rep.sev === 'death';
    const title = urgent ? '🚨 긴급 사고 발생 — ' + rep.site : '📋 새 사고 보고 — ' + rep.site;
    const body = rep.type + ' · ' + SEV_LABEL[rep.sev] + ' · ' + rep.place;

    // 각 토큰에 FCM 메시지 전송 (Firebase DB에 발송 요청 기록)
    // ※ 실제 발송은 Firebase Cloud Functions 또는 서버에서 처리
    //   지금은 DB에 발송 큐를 쌓는 방식으로 구현
    await firebase.database().ref('channels/' + CHANNEL + '/pushQueue').push({
      title, body, tokens: Object.keys(tokens),
      data: {
        title: rep.title, site: rep.site, type: rep.type,
        sev: rep.sev, place: rep.place, dt: rep.dt,
        content: rep.content || '', channel: CHANNEL
      },
      createdAt: Date.now()
    });
  } catch(e) {
    console.warn('FCM 발송 오류:', e);
  }
}

function downloadExcel() {
  if (!reports.length) return;
  const headers = ['순번','제목','사업장','사고일시','사고유형','사고원인','사고장소','부상(피해)정도','사고내용','사진(장)','등록시각'];
  const aoa = [
    ['현장 사고 보고 이력 — 채널: ' + CHANNEL],
    ['출력일시: ' + new Date().toLocaleString('ko-KR') + '    /    총 ' + reports.length + '건'],
    [], headers
  ];
  reports.forEach((r,i) => aoa.push([
    reports.length-i, r.title, r.site, r.dt.replace('T',' '),
    r.type, r.cause, r.place, SEV_LABEL[r.sev], r.content,
    r.photos, new Date(r.reportedAt).toLocaleString('ko-KR')
  ]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const lastCol = headers.length - 1;
  const C = (c,r) => XLSX.utils.encode_cell({c,r});
  const NAVY='1E3A5F', STRIPE='E6EBF1', WHITE='FFFFFF', BORD='B9C3CF';
  const SEV_TXT = {'무상해':'0E8A52','경상':'B06E00','중상':'C0492B','사망':'B11D14'};
  const thin = {style:'thin',color:{rgb:BORD}};
  const AB = {top:thin,bottom:thin,left:thin,right:thin};
  ws['!merges'] = [{s:{c:0,r:0},e:{c:lastCol,r:0}},{s:{c:0,r:1},e:{c:lastCol,r:1}}];
  const t0 = ws[C(0,0)]; if(t0) t0.s={font:{bold:true,sz:15,color:{rgb:NAVY}},alignment:{horizontal:'left',vertical:'center'}};
  const t1 = ws[C(0,1)]; if(t1) t1.s={font:{sz:10,color:{rgb:'7A8794'}},alignment:{horizontal:'left'}};
  for(let c=0;c<=lastCol;c++){const hc=ws[C(c,3)];if(hc)hc.s={font:{bold:true,sz:11,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:NAVY}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:AB};}
  reports.forEach((r,i)=>{
    const ri=4+i; const stripe=i%2===1?STRIPE:WHITE;
    for(let c=0;c<=lastCol;c++){const cell=ws[C(c,ri)];if(cell)cell.s={font:{sz:10},fill:{fgColor:{rgb:stripe}},alignment:{horizontal:c===0||c===9?'center':'left',vertical:'center',wrapText:true},border:AB};}
    const sc=ws[C(7,ri)]; const lbl=SEV_LABEL[r.sev];
    if(sc)sc.s={font:{bold:true,sz:10.5,color:{rgb:SEV_TXT[lbl]}},fill:{fgColor:{rgb:stripe}},alignment:{horizontal:'center',vertical:'center'},border:AB};
  });
  ws['!cols']=[{wch:6},{wch:28},{wch:16},{wch:18},{wch:11},{wch:22},{wch:20},{wch:15},{wch:34},{wch:8},{wch:20}];
  ws['!rows']=[{hpt:26},{hpt:16},{hpt:6},{hpt:24}];
  for(let i=0;i<reports.length;i++) ws['!rows'].push({hpt:28});
  ws['!freeze']={xSplit:0,ySplit:4};
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '사고보고이력');
  XLSX.writeFile(wb, `사고보고이력_${CHANNEL}_${new Date().toISOString().slice(0,10)}.xlsx`);
};

// ───────────────────────────────────────────
// 대시보드 렌더링
function renderDash() {
  const el = document.getElementById('dashContent');
  if (!el) return;
  if (!reports.length) {
    el.innerHTML = `<div class="empty" style="margin-top:40px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V5"/></svg><p>등록된 사고 보고가 없습니다.</p></div>`;
    return;
  }

  const now = new Date();
  const thisMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  const monthReps = reports.filter(r => r.dt && r.dt.startsWith(thisMonth));

  // 부상정도별 집계
  const sevCount = {none:0,light:0,severe:0,death:0};
  reports.forEach(r => { if(sevCount[r.sev]!==undefined) sevCount[r.sev]++; });

  // 사후처리별 집계
  const afterCount = {none:0,industry:0,work:0,etc:0};
  reports.forEach(r => { const v=r.afterProcess||'none'; if(afterCount[v]!==undefined) afterCount[v]++; });

  // 유형별 집계
  const typeMap = {};
  reports.forEach(r => { typeMap[r.type] = (typeMap[r.type]||0)+1; });
  const typeEntries = Object.entries(typeMap).sort((a,b)=>b[1]-a[1]);

  // 현장별 집계
  const siteMap = {};
  reports.forEach(r => { siteMap[r.site] = (siteMap[r.site]||0)+1; });
  const siteEntries = Object.entries(siteMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const siteMax = siteEntries[0]?.[1] || 1;

  // 도넛 차트 색
  const COLORS = ['#e8441a','#1e3a5f','#f59e0b','#0d9e6e','#7c3aed','#ef4444','#06b6d4','#84cc16','#f97316'];

  el.innerHTML = `
    <div class="dash-section">
      <div class="dash-title">📊 보고 현황</div>
      <div class="kpi-grid">
        <div class="kpi-card accent"><div class="kv">${reports.length}</div><div class="kl">전체 누적 건수</div></div>
        <div class="kpi-card"><div class="kv" style="color:var(--navy)">${monthReps.length}</div><div class="kl">이번 달 보고</div></div>
        <div class="kpi-card danger"><div class="kv">${sevCount.death}</div><div class="kl">사망</div></div>
        <div class="kpi-card warn"><div class="kv">${sevCount.severe}</div><div class="kl">중상</div></div>
        <div class="kpi-card ok"><div class="kv">${sevCount.light}</div><div class="kl">경상</div></div>
        <div class="kpi-card"><div class="kv" style="color:var(--muted)">${sevCount.none}</div><div class="kl">무상해</div></div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">🔄 사후 처리 현황</div>
      <div class="after-summary">
        <div class="after-sum-card"><div class="asv" style="color:#2563eb">${afterCount.industry}</div><div class="asl">산재처리</div></div>
        <div class="after-sum-card"><div class="asv" style="color:#16a34a">${afterCount.work}</div><div class="asl">공상처리</div></div>
        <div class="after-sum-card"><div class="asv" style="color:#7c3aed">${afterCount.etc}</div><div class="asl">기타</div></div>
      </div>
      ${afterCount.none > 0 ? `<div style="margin-top:8px;font-size:12px;color:var(--accent);font-weight:700;text-align:center;">⚠ 미처리 ${afterCount.none}건 — 이력 탭에서 처리 결과를 입력해주세요.</div>` : ''}
    </div>

    <div class="dash-section">
      <div class="dash-title">📈 사고 유형 분포</div>
      <div class="donut-wrap">
        <canvas id="donutChart" width="180" height="180"></canvas>
        <div class="legend" id="donutLegend"></div>
      </div>
    </div>

    <div class="dash-section">
      <div class="dash-title">🏗 현장별 발생 건수</div>
      <div class="site-bar">
        ${siteEntries.map(([name,cnt])=>`
          <div class="site-row">
            <span class="site-name">${esc(name)}</span>
            <div class="site-bar-bg"><div class="site-bar-fill" style="width:${Math.round(cnt/siteMax*100)}%"></div></div>
            <span class="site-count">${cnt}건</span>
          </div>`).join('')}
      </div>
    </div>`;

  // 도넛 차트 그리기
  setTimeout(() => {
    const canvas = document.getElementById('donutChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const total = typeEntries.reduce((s,[,v])=>s+v,0);
    if (!total) return;
    let startAngle = -Math.PI/2;
    const cx=90,cy=90,r=70,ir=42;
    typeEntries.forEach(([,v],i)=>{
      const slice = (v/total)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,startAngle,startAngle+slice);
      ctx.closePath();ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
      startAngle+=slice;
    });
    // 가운데 구멍
    ctx.beginPath();ctx.arc(cx,cy,ir,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    // 가운데 텍스트
    ctx.fillStyle='#1c2733';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(total,cx,cy-8);
    ctx.font='11px sans-serif';ctx.fillStyle='#6b7a8d';ctx.fillText('총 건수',cx,cy+12);
    // 범례
    const leg = document.getElementById('donutLegend');
    if(leg) leg.innerHTML = typeEntries.map(([name,v],i)=>`
      <span class="legend-item"><span class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></span>${esc(name)} ${v}건</span>`).join('');
  }, 50);
}

// ───────────────────────────────────────────
// 사후처리 모달
const ADMIN_PW = '0822'; // ← 관리자 비밀번호 (변경 가능)
let afterTargetId = null;
let afterSelVal = 'none';

function openAfterEdit(id) {
  afterTargetId = id;
  const rep = reports.find(r=>String(r.id)===String(id));
  afterSelVal = rep?.afterProcess || 'none';

  const scrim = document.createElement('div');
  scrim.className = 'after-modal-scrim';
  scrim.id = 'afterModalScrim';
  scrim.innerHTML = `
    <div class="after-modal">
      <h3>사후처리 결과 입력</h3>
      <p>관리자 비밀번호를 입력 후 처리 결과를 선택하세요.</p>
      <input class="pw-field" type="password" id="afterPwInput" placeholder="관리자 비밀번호">
      <div class="after-opts">
        <button class="after-opt${afterSelVal==='none'?' sel':''}" data-v="none" onclick="selAfter(this)">⏳ 미처리</button>
        <button class="after-opt${afterSelVal==='industry'?' sel':''}" data-v="industry" onclick="selAfter(this)">🏛 산재처리</button>
        <button class="after-opt${afterSelVal==='work'?' sel':''}" data-v="work" onclick="selAfter(this)">🏥 공상처리</button>
        <button class="after-opt${afterSelVal==='etc'?' sel':''}" data-v="etc" onclick="selAfter(this)">📋 기타</button>
      </div>
      <button class="after-save-btn" onclick="saveAfter()">저장</button>
      <button onclick="closeAfterModal()" style="width:100%;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit;">취소</button>
    </div>`;
  document.body.appendChild(scrim);
  document.getElementById('afterPwInput').focus();
}

function selAfter(btn) {
  document.querySelectorAll('.after-opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  afterSelVal = btn.dataset.v;
}

async function saveAfter() {
  const pw = document.getElementById('afterPwInput')?.value;
  if (pw !== ADMIN_PW) { alert('비밀번호가 틀렸습니다.'); return; }
  const idx = reports.findIndex(r=>String(r.id)===String(afterTargetId));
  if (idx < 0) return;
  reports[idx].afterProcess = afterSelVal;
  await DB.save(reports);
  closeAfterModal();
  renderHist();
  renderDash();
}

function closeAfterModal() {
  const el = document.getElementById('afterModalScrim');
  if (el) el.remove();
}

// ───────────────────────────────────────────
// 탭 전환
const submitbar = document.getElementById('submitbar');
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  const pg = t.dataset.page;
  const pageId = pg==='dash' ? 'page-dash' : pg==='write' ? 'page-write' : 'page-hist';
  document.getElementById(pageId).classList.add('on');
  submitbar.style.display = pg === 'write' ? 'block' : 'none';
  if (pg === 'dash') renderDash();
  window.scrollTo(0,0);
});
</script>
