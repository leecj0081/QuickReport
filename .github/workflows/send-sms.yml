name: 사고보고 SMS 알림

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 버튼
  schedule:
    - cron: '* * * * *'  # 1분마다 Firebase 체크

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install firebase-admin axios

      - name: Firebase 체크 및 SMS 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVI }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          SOLAPI_SENDER: ${{ secrets.SOLAPI_SENDER }}
        run: node check-and-send.js
